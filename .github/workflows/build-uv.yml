name: Build uv（自解压壳单文件）

# 官方 uv（musl 静态）→ 自解压壳单文件（[静态壳][xz(BCJ) 载荷][72B 尾部]），与 python3 配对。
# 升级 uv：Actions 手动触发并把 uv_version 填 latest（或指定版本）；默认固定 0.12.24。
# latest 会先做稳定性过滤（排除 prerelease/draft），失败自动回退到固定版本。
on:
  workflow_dispatch:
    inputs:
      uv_version:
        description: 'uv 版本（如 0.12.24，或 latest）'
        required: false
        default: '0.12.24'
  push:
    paths:
      - 'scripts/build/uv.sh'
      - 'scripts/build/dyn-common.sh'
      - 'scripts/build/py3dyn-stub.c'
      - '.github/workflows/build-uv.yml'

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖（qemu 供 arm64 运行校验 / xz / 打包工具）
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static zip unzip bzip2 build-essential

      - name: 准备动态构建环境（Bootlin musl 工具链×2 / xz 5.6.4 / xz-embedded / musl loader）
        run: bash scripts/build/dyn-common.sh --setup

      - name: 构建 aarch64（uv ${{ inputs.uv_version || '0.12.24' }}）
        env:
          UV_VERSION: ${{ inputs.uv_version || '0.12.24' }}
        run: ARCH=arm64 bash scripts/build/uv.sh

      - name: 构建 x86_64（uv ${{ inputs.uv_version || '0.12.24' }}）
        env:
          UV_VERSION: ${{ inputs.uv_version || '0.12.24' }}
        run: ARCH=amd64 bash scripts/build/uv.sh

      - name: 壳级抽查（两架构实际运行）
        run: |
          set -eux
          tools/uv/amd64/uv --version
          qemu-aarch64-static tools/uv/arm64/uv --version

      - name: 提交产物（重置到最新 main 后重放 baked 产物）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git config user.name "Minis Agent"
          git config user.email "otaku-say@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            echo "第 $i 轮：重置到 origin/main 后重新落地产物"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p tools/uv/arm64 tools/uv/amd64
            cp /tmp/uv-arm64-single tools/uv/arm64/uv
            cp /tmp/uv-amd64-single tools/uv/amd64/uv
            chmod +x tools/uv/arm64/uv tools/uv/amd64/uv
            for a in arm64 amd64; do
              ( cd tools && find . -path "./*/$a/*" -type f | sed 's|^\./||' | sort | xargs -r sha256sum > "SHA256SUMS.$a" )
            done
            bash scripts/gen-doc-sums.sh || true
            bash scripts/gen-table.sh || true
            git add -A
            if git diff --cached --quiet; then echo "无变更"; exit 0; fi
            git commit -m "build: uv 自解压壳单文件（官方 musl 静态载荷） [arm64+amd64] $(date -u +%Y-%m-%d)" >/dev/null
            if git push >/dev/null 2>&1; then echo "push 成功（第 $i 次）"; exit 0; fi
            echo "push 被拒，重试…"; sleep $((i * 3))
          done
          echo "push 多次失败"; exit 1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uv-shell
          path: /tmp/uv-*-single
          retention-days: 14
