name: Build uv（自解压壳单文件）

# 官方 uv（musl 静态）→ 自解压壳单文件（[静态壳][xz(BCJ) 载荷][72B 尾部]），与 python3 配对。
#
# 版本策略（自动跟随上游）：
#   - 每日定时（cron）解析 astral-sh/uv 最新**稳定** release（显式排除 prerelease/draft）；
#     与库内现版一致 → 跳过整套构建（轻量快速退出）；有新版 → 全量构建并提交产物。
#   - 手动触发可指定 uv_version（默认 latest）；force=true 强制重建（版本未变也构建）。
#   - 解析失败自动回退固定版本（FALLBACK_VERSION）。
on:
  schedule:
    - cron: "40 19 * * *" # 每日 19:40 UTC（北京时间 03:40）
  workflow_dispatch:
    inputs:
      uv_version:
        description: 'uv 版本（如 0.12.24，或 latest）'
        required: false
        default: 'latest'
      force:
        description: '强制重建（即使版本未变）'
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/build/uv.sh'
      - 'scripts/build/dyn-common.sh'
      - 'scripts/build/py3dyn-stub.c'
      - '.github/workflows/build-uv.yml'

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: 解析目标版本并决定是否跳过
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          FALLBACK=0.12.24
          WANT="${{ github.event_name == 'workflow_dispatch' && inputs.uv_version || 'latest' }}"
          if [ -z "${WANT}" ]; then WANT=latest; fi
          if [ "${WANT}" = "latest" ]; then
            V=$(curl -fsSL --retry 3 --max-time 30 "https://api.github.com/repos/astral-sh/uv/releases?per_page=30" \
                 | jq -r '[.[] | select(.prerelease == false and .draft == false) | .tag_name | sub("^v";"")] | first // empty')
            if [ -z "${V}" ]; then echo "⚠ latest 解析失败，回退 ${FALLBACK}"; V="${FALLBACK}"; fi
          else
            V="${WANT#v}"
          fi
          CUR=""
          chmod +x tools/uv/amd64/uv 2>/dev/null || true
          if [ -x tools/uv/amd64/uv ]; then CUR="$(tools/uv/amd64/uv --version 2>/dev/null | awk '{print $2}' || true)"; fi
          echo "目标版本=${V}  库内版本=${CUR:-未知}  事件=${{ github.event_name }}"
          SKIP=false
          if [ "${V}" = "${CUR}" ] && [ "${{ github.event_name }}" != "push" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
              echo "版本未变，但显式 force=true → 不跳过"
            else
              SKIP=true
              echo "版本未变 → 跳过构建"
            fi
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖（qemu 供 arm64 运行校验 / xz / 打包工具）
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static zip unzip bzip2 build-essential

      - name: 准备动态构建环境（Bootlin musl 工具链×2 / xz 5.6.4 / xz-embedded / musl loader）
        run: bash scripts/build/dyn-common.sh --setup

      - name: 构建 aarch64（uv ${{ needs.resolve.outputs.version }}）
        env:
          UV_VERSION: ${{ needs.resolve.outputs.version }}
        run: ARCH=arm64 bash scripts/build/uv.sh

      - name: 构建 x86_64（uv ${{ needs.resolve.outputs.version }}）
        env:
          UV_VERSION: ${{ needs.resolve.outputs.version }}
        run: ARCH=amd64 bash scripts/build/uv.sh

      - name: 壳级抽查（两架构实际运行）
        run: |
          set -eux
          tools/uv/amd64/uv --version
          qemu-aarch64-static tools/uv/arm64/uv --version

      - name: 提交产物（重置到最新 main 后重放 baked 产物）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git config user.name "Minis Agent"
          git config user.email "otaku-say@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            echo "第 $i 轮：重置到 origin/main 后重新落地产物"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p tools/uv/arm64 tools/uv/amd64
            cp /tmp/uv-arm64-single tools/uv/arm64/uv
            cp /tmp/uv-amd64-single tools/uv/amd64/uv
            chmod +x tools/uv/arm64/uv tools/uv/amd64/uv
            for a in arm64 amd64; do
              ( cd tools && find . -path "./*/$a/*" -type f | sed 's|^\./||' | sort | xargs -r sha256sum > "SHA256SUMS.$a" )
            done
            bash scripts/gen-doc-sums.sh || true
            bash scripts/gen-table.sh || true
            git add -A
            if git diff --cached --quiet; then echo "无变更"; exit 0; fi
            git commit -m "build: uv 自解压壳单文件（官方 musl 静态载荷） [arm64+amd64] $(date -u +%Y-%m-%d)" >/dev/null
            if git push >/dev/null 2>&1; then echo "push 成功（第 $i 次）"; exit 0; fi
            echo "push 被拒，重试…"; sleep $((i * 3))
          done
          echo "push 多次失败"; exit 1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uv-shell
          path: /tmp/uv-*-single
          retention-days: 14
