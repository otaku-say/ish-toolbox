name: 跟随上游更新二进制

on:
  schedule:
    # 每天 UTC 03:23 跑一次（错开整点，避开 GitHub 调度高峰）
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      arch:
        description: 只同步指定架构（留空=全部）
        required: false
        default: ''
  push:
    paths:
      - 'scripts/sync-upstream.sh'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

jobs:
  sync:
    name: 同步 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # 一个架构失败不影响另一个
      matrix:
        arch: [arm64, amd64]  # x86_64 runner 上可同时产出两种架构
    steps:
      - uses: actions/checkout@v4

      - name: 装 UPX（入库前统一压缩）
        run: |
          if curl -fsSL -o /tmp/upx.txz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz; then
            tar xJf /tmp/upx.txz -C /tmp
            sudo cp /tmp/upx-4.2.4-amd64_linux/upx /usr/local/bin/
            upx --version | head -1
          else
            echo "UPX 下载失败，本次跳过压缩"; echo "UPX=0" >> "$GITHUB_ENV"
          fi

      # 从上游 latest release 抓取 + 三判据验证 + UPX + 覆盖（幂等）
      - name: 抓取并验证
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/sync-upstream.sh

      - name: 体检
        run: sh scripts/doctor.sh ${{ matrix.arch }}

      - name: 提交变更
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # arm64 / amd64 两个 job 会**同时**结束并 push，直接 push 必然撞车
          # （failed to push some refs）。所以：先 rebase，push 失败则重试。
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            git add -A
            if git diff --cached --quiet; then
              echo "无变更"; exit 0
            fi
            git commit -m "build: 跟随上游更新二进制 [${{ matrix.arch }}] $(date -u +%Y-%m-%d)" >/dev/null
            if git push; then echo "push 成功（第 $i 次尝试）"; exit 0; fi
            echo "push 被拒，重试 $i/5…"; sleep $((i * 3))
          done
          echo "push 多次失败"; exit 1

      # 上游发布后若判定失败，在这里能看到原因
      - name: 摘要
        if: always()
        run: |
          echo "### ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ( cd tools/${{ matrix.arch }} && ls -l | awk 'NR>1{printf "%-10s %8.1f MB\n", $9, $5/1048576}' ) >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
