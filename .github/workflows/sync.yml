name: 跟随上游更新二进制

on:
  schedule:
    # 每天 UTC 03:23 跑一次（错开整点，避开 GitHub 调度高峰）
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      arch:
        description: 只同步指定架构（留空=全部）
        required: false
        default: ''
  push:
    paths:
      - 'scripts/sync-upstream.sh'
      - 'MANIFEST.extra.tsv'     # 自编译工具元数据变更时，MANIFEST 也要重新合并
      - 'scripts/gen-table.sh'
      - 'scripts/doctor.sh'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  # 与 build-source / build-curl 共用同一组：所有会提交的流水线串行
  group: repo-writer
  cancel-in-progress: false

jobs:
  sync:
    name: 同步 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # 一个架构失败不影响另一个
      matrix:
        arch: [arm64, amd64]  # x86_64 runner 上可同时产出两种架构
    steps:
      - uses: actions/checkout@v4

      - name: 装 UPX（锁定 4.2.4；升级前必须在 iSH 真机验证）
        # 同 build-source.yml：5.2.1 压缩产物在 iSH 段错误（实锤）→ 锁定 4.2.4。
        run: |
          if curl -fsSL -o /tmp/upx.txz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz; then
            tar xJf /tmp/upx.txz -C /tmp
            sudo cp /tmp/upx-4.2.4-amd64_linux/upx /usr/local/bin/
            upx --version | head -1
          else
            echo "UPX 下载失败，本次跳过压缩"; echo "UPX=0" >> "$GITHUB_ENV"
          fi

      # 从上游 latest release 抓取 + 三判据验证 + UPX + 覆盖（幂等）
      - name: 抓取并验证
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/sync-upstream.sh

      - name: 体检
        run: sh scripts/doctor.sh ${{ matrix.arch }}

      - name: 刷新 README 对比表
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/gen-table.sh || echo 'gen-table 失败（不阻断提交）'

      - name: 提交变更
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 两个 job 同时结束会撞车：先本地 commit；push 失败则 fetch+rebase 重试。
          # rebase 冲突时生成物以本地产物为准（--theirs），杜绝冲突标记入库。
          git add -A
          if git diff --cached --quiet; then echo "无变更"; exit 0; fi
          git commit -m "build: 跟随上游更新二进制 [${{ matrix.arch }}] $(date -u +%Y-%m-%d)" >/dev/null
          for i in 1 2 3 4 5; do
            if git push >/dev/null 2>&1; then echo "push 成功（第 $i 次）"; exit 0; fi
            echo "push 被拒，重试 $i/5…"
            git fetch origin main >/dev/null 2>&1
            if ! git rebase origin/main >/dev/null 2>&1; then
              echo "rebase 冲突：生成物以本地产物为准"
              for f in $(git diff --name-only --diff-filter=U); do git checkout --theirs -- "$f" 2>/dev/null || true; done
              git add -A
              GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || { echo "✗ rebase 无法收敛"; git rebase --abort 2>/dev/null || true; exit 1; }
            fi
            sleep $((i * 3))
          done
          echo "push 多次失败"; exit 1

      # 上游发布后若判定失败，在这里能看到原因
      - name: 摘要
        if: always()
        run: |
          echo "### ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh tools/*/${{ matrix.arch }} 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(空)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
