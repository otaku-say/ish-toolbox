name: runner-probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runner-probe.yml'
permissions:
  contents: read
jobs:
  arm:
    name: arm64 探测
    runs-on: ubuntu-24.04-arm
    steps:
      - run: uname -m; nproc; echo ARM64-RUNNER-OK
  x64:
    name: x64 对照
    runs-on: ubuntu-latest
    steps:
      - run: uname -m; nproc; echo X64-RUNNER-OK
