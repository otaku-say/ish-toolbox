name: 使用说明清单

# 每个工具的 USAGE.md 是 Agent 取用该工具时的唯一说明书。
# 本流水线只做两件事（不编译任何东西，秒级完成）：
#   1. 门禁：tools/<工具>/ 必须有 USAGE.md，缺一个就失败
#   2. 自愈：tools/DOCS.sha256 与现状不一致就重新生成并提交
#
# 产物清单 tools/DOCS.sha256 会被本地技能 install.sh --update 拉取，
# 因此「说明」与「二进制」永远同版本分发。

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**/USAGE.md'
      - 'scripts/gen-doc-sums.sh'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '17 4 * * *'          # 每日 UTC 04:17 兜底核对一次

permissions:
  contents: write

concurrency:
  group: repo-writer            # 与 sync / build-source / build-curl 串行，避免提交撞车
  cancel-in-progress: false

jobs:
  doc-sums:
    name: 校验并刷新文档清单
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 生成 tools/DOCS.sha256（缺文档则失败）
        run: bash scripts/gen-doc-sums.sh

      - name: 提交变更
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 每轮重试都重置到最新 origin/main 后重新生成清单再提交（不 rebase；
          # 与其它流水线共用 repo-writer 组，rebase 会在生成物上冲突）。
          for i in 1 2 3 4 5; do
            git fetch origin main >/dev/null 2>&1
            git reset --hard origin/main >/dev/null 2>&1
            bash scripts/gen-doc-sums.sh
            git add -A
            if git diff --cached --quiet; then echo "清单已是最新"; exit 0; fi
            git commit -m "docs: 刷新 tools/DOCS.sha256 [skip ci]" >/dev/null
            if git push >/dev/null 2>&1; then echo "push 成功（第 $i 次）"; exit 0; fi
            echo "push 被拒，重试 $((i+1))/5…"
            sleep $((i * 3))
          done
          echo "push 多次失败"; exit 1
