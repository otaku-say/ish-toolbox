name: 从源码构建静态二进制

# 上游不给 arm64 产物的工具，在这里编译 —— 免费、可复现、产物直接进仓库。
# 覆盖：fzy / patch / nnn / b3sum / jaq / ncdu（每个都 × arm64 + amd64）

on:
  workflow_dispatch:              # 手动触发
  push:
    paths:
      # 任何构建相关脚本改动都要重跑 —— 曾经只写了一个文件，
      # 结果改 scripts/build/*.sh（每工具独立脚本）时 CI 根本不触发
      - 'scripts/build-from-source-ci.sh'
      - 'scripts/build/**'
      - '.github/workflows/build-source.yml'
  schedule:
    - cron: '37 3 * * *'          # 每日 UTC 03:37 跟一次（上游有新提交就重建）

permissions:
  contents: write

concurrency:
  group: build-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools autoconf automake libtool pkg-config libncurses-dev

      - name: Rust 工具链
        run: |
          curl -sSf https://sh.rustup.rs -o /tmp/ru.sh
          sh /tmp/ru.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: musl 交叉工具链
        # v1 用 musl.cc 失败了（runner 连它超时 135s）。
        # arm64 改为完全依赖两个稳定源：
        #   · Zig（自带 musl libc，负责 C 部分）—— 从 GitHub Release 装
        #   · Rust 自带 self-contained 链接（rust-lld + libc.a）
        if: matrix.arch == 'arm64'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: 装 UPX（可选压缩，URL 直取避免 apt 包名差异）
        run: |
          if curl -fsSL -o /tmp/upx.txz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz; then
            tar xJf /tmp/upx.txz -C /tmp
            sudo cp /tmp/upx-4.2.4-amd64_linux/upx /usr/local/bin/
            upx --version | head -1
          else
            echo "UPX 下载失败，本次跳过压缩"
            echo "UPX=0" >> "$GITHUB_ENV"
          fi

      - name: 编译并验证
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/build-from-source-ci.sh
          echo "### ${{ matrix.arch }} 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l "tools/${{ matrix.arch }}" | awk 'NR>1{printf "%-10s %8.2f MB\n", $9, $5/1048576}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 提交变更
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 让产物带上可执行位（runner 上 chmod 有效，直接记录 mode）
          git add -A
          if git diff --cached --quiet; then
            echo "无变更（产物与仓库一致）"
          else
            git commit -m "build: 从源码构建静态二进制 [${{ matrix.arch }}] $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 上传产物（便于人工检查）
        uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.arch }}
          path: tools/${{ matrix.arch }}/
          retention-days: 14
