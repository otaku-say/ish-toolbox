name: 从源码构建静态二进制

# 上游不给 arm64 产物的工具，在这里编译 —— 免费、可复现、产物直接进仓库。
# 覆盖：patch / micropython / tree / sqlite3（每个都 × arm64 + amd64）

on:
  workflow_dispatch:              # 手动触发
  push:
    paths:
      # 任何构建相关脚本改动都要重跑 —— 曾经只写了一个文件，
      # 结果改 scripts/build/*.sh（每工具独立脚本）时 CI 根本不触发
      - 'scripts/build-from-source-ci.sh'
      - 'scripts/build/**'
      # LibreSSL 套件（curl/openssl/ssh/socat）由 build-curl.yml 负责，别在这里白跑
      - '!scripts/build/curl.sh'
      - '!scripts/build/openssh.sh'
      - '!scripts/build/socat.sh'
      - '!scripts/build/drill.sh'
      - '.github/workflows/build-source.yml'
  schedule:
    - cron: '37 3 * * *'          # 每日 UTC 03:37 跟一次（上游有新提交就重建）

permissions:
  contents: write

concurrency:
  # 与 sync / build-curl 共用同一组：所有会提交的流水线串行
  group: repo-writer
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools autoconf automake libtool pkg-config unzip

      - name: 交叉工具链（micropython 的 arm64 用 glibc 静态链接）
        # Zig 的 glibc target 不带完整 libc.a；Debian 交叉链自带，最稳
        if: matrix.arch == 'arm64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust 工具链
        run: |
          curl -sSf https://sh.rustup.rs -o /tmp/ru.sh
          sh /tmp/ru.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Musl 交叉工具链（Zig，两个架构都装）
        # v1 用 musl.cc 失败了（runner 连它超时 135s），改从 GitHub Release 装 Zig。
        # 两个架构都装：arm64 的 C 构建 + 两架构的 C++ 构建（html2text 用 zig c++）。
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: 装 UPX（可选压缩，URL 直取避免 apt 包名差异）
        run: |
          if curl -fsSL -o /tmp/upx.txz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz; then
            tar xJf /tmp/upx.txz -C /tmp
            sudo cp /tmp/upx-4.2.4-amd64_linux/upx /usr/local/bin/
            upx --version | head -1
          else
            echo "UPX 下载失败，本次跳过压缩"
            echo "UPX=0" >> "$GITHUB_ENV"
          fi

      - name: 编译并验证
        env:
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/build-from-source-ci.sh
          echo "### ${{ matrix.arch }} 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh tools/*/${{ matrix.arch }} 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(无产物)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 提交变更
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 每轮重试都「重置到最新 origin/main → 重新产出」再提交，绝不在旧工作树上 rebase。
          # 理由：本流水线与 sync / build-source 共用 repo-writer 组，可能同时结束；
          # rebase 会在双方同为生成物的文件上冲突（tools/SHA256SUMS.<arch>，2026-10 实锤）。
          rm -rf /tmp/tools-baked && cp -a tools /tmp/tools-baked
          for i in 1 2 3 4 5; do
            echo "第 $i 轮：重置到 origin/main 后铺回产物"
            git fetch origin main >/dev/null 2>&1
            git reset --hard origin/main >/dev/null 2>&1
            rm -rf tools && cp -a /tmp/tools-baked tools
            git add -A
            if git diff --cached --quiet; then echo "无变更"; exit 0; fi
            git commit -m "build: 从源码构建静态二进制 [${{ matrix.arch }}] $(date -u +%Y-%m-%d)" >/dev/null
            if git push >/dev/null 2>&1; then echo "push 成功（第 $i 次）"; exit 0; fi
            echo "push 被拒，重试 $((i+1))/5…"
            sleep $((i * 3))
          done
          echo "push 多次失败"; exit 1

      - name: 上传产物（便于人工检查）
        uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.arch }}
          path: tools/*/${{ matrix.arch }}/
          retention-days: 14
