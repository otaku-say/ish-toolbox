name: 从源码构建静态二进制

# 上游不给 arm64 产物的工具，在这里编译 —— 免费、可复现、产物直接进仓库。
# 覆盖：patch / micropython / tree / sqlite3（每个都 × arm64 + amd64）

on:
  workflow_dispatch:              # 手动触发
  push:
    paths:
      # 任何构建相关脚本改动都要重跑 —— 曾经只写了一个文件，
      # 结果改 scripts/build/*.sh（每工具独立脚本）时 CI 根本不触发
      - 'scripts/build-from-source-ci.sh'
      - 'scripts/build/**'
      - '.github/workflows/build-source.yml'
  schedule:
    - cron: '37 3 * * *'          # 每日 UTC 03:37 跟一次（上游有新提交就重建）

permissions:
  contents: write

concurrency:
  # 与 sync / build-curl 共用同一组：所有会提交的流水线串行
  group: repo-writer
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools autoconf automake libtool pkg-config unzip

      - name: 交叉工具链（micropython 的 arm64 用 glibc 静态链接）
        # Zig 的 glibc target 不带完整 libc.a；Debian 交叉链自带，最稳
        if: matrix.arch == 'arm64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust 工具链
        run: |
          curl -sSf https://sh.rustup.rs -o /tmp/ru.sh
          sh /tmp/ru.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: musl 交叉工具链
        # v1 用 musl.cc 失败了（runner 连它超时 135s）。
        # arm64 改为完全依赖两个稳定源：
        #   · Zig（自带 musl libc，负责 C 部分）—— 从 GitHub Release 装
        #   · Rust 自带 self-contained 链接（rust-lld + libc.a）
        if: matrix.arch == 'arm64'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: 装 UPX（可选压缩，URL 直取避免 apt 包名差异）
        run: |
          if curl -fsSL -o /tmp/upx.txz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz; then
            tar xJf /tmp/upx.txz -C /tmp
            sudo cp /tmp/upx-4.2.4-amd64_linux/upx /usr/local/bin/
            upx --version | head -1
          else
            echo "UPX 下载失败，本次跳过压缩"
            echo "UPX=0" >> "$GITHUB_ENV"
          fi

      - name: 编译并验证
        env:
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/build-from-source-ci.sh
          echo "### ${{ matrix.arch }} 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l "tools/${{ matrix.arch }}" | awk 'NR>1{printf "%-10s %8.2f MB\n", $9, $5/1048576}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 提交变更
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 两个 job 同时结束会撞车：先本地 commit；push 失败则 fetch+rebase 重试。
          # rebase 冲突时生成物以本地产物为准（--theirs），杜绝冲突标记入库。
          git add -A
          if git diff --cached --quiet; then echo "无变更"; exit 0; fi
          git commit -m "build: 从源码构建静态二进制 [${{ matrix.arch }}] $(date -u +%Y-%m-%d)" >/dev/null
          for i in 1 2 3 4 5; do
            if git push; then echo "push 成功（第 $i 次）"; exit 0; fi
            echo "push 被拒，重试 $i/5…"
            git fetch origin main
            if ! git rebase origin/main >/dev/null 2>&1; then
              echo "rebase 冲突：生成物以本地产物为准"
              for f in $(git diff --name-only --diff-filter=U); do git checkout --theirs -- "$f" 2>/dev/null || true; done
              git add -A
              GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || { echo "✗ rebase 无法收敛"; git rebase --abort 2>/dev/null || true; exit 1; }
            fi
            sleep $((i * 3))
          done
          echo "push 多次失败"; exit 1

      - name: 上传产物（便于人工检查）
        uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.arch }}
          path: tools/${{ matrix.arch }}/
          retention-days: 14
